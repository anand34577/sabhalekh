name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem or the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Sabhalekh help?
  - type: textarea
    id: other
    attributes:
      label: Anything else?
      description: Screenshots, other apps that do this well, etc.
