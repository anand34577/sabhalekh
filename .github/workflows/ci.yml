name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "wiki/**"
      - "site/**"
      - "**.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: "Backend tests (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    # Windows is the supported platform. Linux and macOS report whether the backend still installs and passes there
    # (recording is Windows-only for now) without blocking a merge.
    continue-on-error: ${{ matrix.os != 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      # The integration tests need the converted models, which are not in the repository; they skip themselves.
      - name: Run tests
        run: python -m pytest tests -q

  app:
    name: "Desktop app (${{ matrix.os }}, UI tests and Rust build check)"
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os != 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install UI dependencies
        working-directory: app
        run: npm ci

      - name: UI tests
        working-directory: app
        run: npm test

      - name: Type check and build the UI
        working-directory: app
        run: npm run build

      - name: Linux system libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      # The shell bundles the frozen backend and the models as resources; empty folders are enough to compile it.
      - name: Placeholder resources
        shell: pwsh
        run: New-Item -ItemType Directory -Force build/backend, build/models, build/bin | Out-Null

      - name: Check the Tauri shell compiles
        working-directory: app/src-tauri
        run: cargo check --locked
