[package]
name = "sabhalekh"
version = "1.3.1"
description = "Sabhalekh: offline meeting transcription"
license = "MIT"
repository = "https://github.com/anand34577/sabhalekh"
edition = "2021"

[lib]
name = "sabhalekh_lib"
# desktop only: "cdylib"/"staticlib" (mobile targets) would make GNU ld exceed the DLL export-ordinal limit
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-notification = "2.7.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
